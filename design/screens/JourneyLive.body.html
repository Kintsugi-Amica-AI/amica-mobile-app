<div class="screen">
  <div class="statusbar-reserve"></div>

  <div class="pad row" style="height:44px;flex-shrink:0;gap:12px;">
    <div style="width:38px;height:38px;border-radius:999px;background:var(--shell);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;color:var(--plum);">
      <svg viewBox="0 0 24 24" width="18" height="18"><path d="m14 5.5-6.5 6.5 6.5 6.5"/></svg>
    </div>
    <div class="col" style="gap:0;">
      <p class="title">Walking home</p>
      <p class="label" style="font-size:11.5px;color:var(--sage);font-weight:600;">Live &middot; sharing with 3</p>
    </div>
    <div class="spacer"></div>
    <div style="width:38px;height:38px;border-radius:999px;background:var(--shell);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;color:var(--plum-70);">
      <svg viewBox="0 0 24 24" width="18" height="18"><path d="M19 13.6A7.2 7.2 0 0 1 10.4 5a7.5 7.5 0 1 0 8.6 8.6Z"/></svg>
    </div>
  </div>

  <!-- Route so far -->
  <div style="flex:1 1 auto;min-height:0;position:relative;overflow:hidden;">
    <svg viewBox="0 0 390 330" width="100%" height="100%" preserveAspectRatio="xMidYMid slice">
      <rect x="0" y="0" width="390" height="330" fill="#EFE5DC"/>
      <g fill="#E3D6CA">
        <rect x="-6" y="-6" width="122" height="96" rx="5"/>
        <rect x="146" y="-6" width="104" height="96" rx="5"/>
        <rect x="280" y="-6" width="116" height="64" rx="5"/>
        <rect x="-6" y="118" width="122" height="88" rx="5"/>
        <rect x="146" y="118" width="104" height="88" rx="5"/>
        <rect x="280" y="86" width="116" height="120" rx="5"/>
        <rect x="-6" y="234" width="122" height="102" rx="5"/>
        <rect x="146" y="234" width="250" height="102" rx="5"/>
      </g>
      <g stroke="#FBF5F0" stroke-width="17" stroke-linecap="square" fill="none">
        <path d="M-6 104H396"/>
        <path d="M-6 220H396"/>
        <path d="M131 -6V336"/>
        <path d="M265 -6V336"/>
      </g>
      <g stroke="#F5EDE6" stroke-width="7" stroke-linecap="square" fill="none">
        <path d="M-6 58H131"/>
        <path d="M265 72H396"/>
        <path d="M62 104V220"/>
        <path d="M330 104V220"/>
      </g>
      <!-- travelled, then remaining -->
      <path d="M92 300 92 220 131 220 131 104 214 104" stroke="#4F7557" stroke-width="5.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M214 104 265 104 265 44" stroke="#9B8490" stroke-width="5.5" stroke-dasharray="2 11" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="92" cy="300" r="6" fill="#4F7557"/>
      <circle cx="265" cy="44" r="9" fill="#FDF8F4" stroke="#3B2230" stroke-width="2.5"/>
      <circle cx="265" cy="44" r="3.4" fill="#3B2230" stroke="none"/>
      <circle cx="214" cy="104" r="24" fill="#4F7557" fill-opacity=".14"/>
      <circle cx="214" cy="104" r="10" fill="#4F7557"/>
      <circle cx="214" cy="104" r="10" stroke="#FDF8F4" stroke-width="3" fill="none"/>
    </svg>
  </div>

  <!-- Check-in panel, all of it inside thumb reach -->
  <div class="pad col" style="background:var(--card);border-top:1px solid var(--line-soft);
       border-radius:24px 24px 0 0;margin-top:-22px;padding-top:18px;flex-shrink:0;gap:14px;box-shadow:var(--shadow);">
    <div class="row">
      <div class="col" style="gap:2px;">
        <p class="micro">Time left</p>
        <p class="num" style="font-family:var(--serif);font-size:38px;line-height:1.05;margin:0;">8:14</p>
      </div>
      <div class="spacer"></div>
      <div class="col" style="gap:3px;align-items:flex-end;">
        <span class="pill pill-sage">Check in by 9:42 PM</span>
        <p class="label" style="font-size:11.5px;color:var(--plum-45);">340 m to go</p>
      </div>
    </div>

    <div style="height:6px;border-radius:999px;background:var(--shell);overflow:hidden;">
      <div style="width:68%;height:6px;border-radius:999px;background:var(--sage);"></div>
    </div>

    <div class="btn btn-safe" style="height:58px;font-size:16.5px;">
      <svg viewBox="0 0 24 24" width="20" height="20"><path d="m5.6 12.6 4.2 4.2 8.6-9.4"/></svg>
      I'm safe &mdash; end journey
    </div>

    <div class="row" style="gap:10px;">
      <div class="btn btn-quiet" style="flex:1 1 0;height:48px;font-size:14.5px;">
        <svg viewBox="0 0 24 24" width="17" height="17"><circle cx="12" cy="12" r="8.4"/><path d="M12 7.2V12l3.2 2"/></svg>
        Add 10 min
      </div>
      <div class="btn" style="flex:1 1 0;height:48px;font-size:14.5px;background:var(--blush);color:var(--terracotta-deep);">
        <svg viewBox="0 0 24 24" width="17" height="17"><path d="M12 3.2 5.6 5.8v5.1c0 4 2.6 7.6 6.4 8.8 3.8-1.2 6.4-4.8 6.4-8.8V5.8L12 3.2Z"/><path d="M12 8.6v4"/><path d="M12 15.4h.01"/></svg>
        I need help
      </div>
    </div>

    <div class="row" style="gap:9px;">
      <div class="row">
        <div class="avatar" style="background:var(--blush);color:var(--terracotta-deep);width:28px;height:28px;font-size:11px;border:2px solid var(--card);">A</div>
        <div class="avatar" style="background:var(--sage-soft);color:var(--sage-ink);width:28px;height:28px;font-size:11px;border:2px solid var(--card);margin-left:-8px;">D</div>
        <div class="avatar" style="background:var(--gold-soft);color:var(--gold);width:28px;height:28px;font-size:11px;border:2px solid var(--card);margin-left:-8px;">R</div>
      </div>
      <p class="label" style="font-size:12px;color:var(--plum-45);">Amma, Dilini and Ruvini can see this journey</p>
    </div>

    <div style="height:2px;"></div>
  </div>
  <div class="gesture-reserve" style="background:var(--card);"></div>
</div>
