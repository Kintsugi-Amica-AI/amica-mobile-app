<div class="screen" style="background:var(--terracotta-deep);color:#FDF1EC;">
  <div class="statusbar-reserve"></div>

  <div class="pad col" style="gap:5px;padding-top:14px;flex-shrink:0;align-items:center;">
    <p class="micro" style="color:#F0B6A5;">Sending an alert</p>
  </div>

  <div class="spacer"></div>

  <!-- The press itself: a ring that fills over 2 seconds -->
  <div class="col" style="align-items:center;gap:26px;">
    <div style="width:260px;height:260px;position:relative;display:flex;align-items:center;justify-content:center;">
      <svg viewBox="0 0 260 260" width="260" height="260" style="position:absolute;inset:0;">
        <circle cx="130" cy="130" r="118" stroke="#FDF1EC" stroke-opacity=".18" stroke-width="6"/>
        <circle cx="130" cy="130" r="118" stroke="#FDF1EC" stroke-width="6"
                stroke-dasharray="459.7 281.7" transform="rotate(-90 130 130)"/>
      </svg>
      <div style="width:198px;height:198px;border-radius:999px;background:rgba(253,241,236,.10);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;">
        <svg viewBox="0 0 24 24" width="46" height="46" stroke-width="1.4"><path d="M12 3.2 5.6 5.8v5.1c0 4 2.6 7.6 6.4 8.8 3.8-1.2 6.4-4.8 6.4-8.8V5.8L12 3.2Z"/><path d="M12 8.6v4"/><path d="M12 15.4h.01"/></svg>
        <div class="num" style="font-family:var(--serif);font-size:38px;line-height:1;">0.8s</div>
      </div>
    </div>

    <div class="col pad" style="align-items:center;gap:9px;">
      <h1 class="display" style="text-align:center;">Keep holding.</h1>
      <p class="body" style="color:#F0B6A5;text-align:center;max-width:280px;font-size:14.5px;">
        Let go now and nothing is sent. No one is told you nearly called.
      </p>
    </div>
  </div>

  <div class="spacer"></div>

  <!-- She should know exactly what she is about to set off -->
  <div class="pad col" style="gap:11px;flex-shrink:0;">
    <p class="micro" style="color:#E09B86;">When the ring closes</p>
    <div class="col" style="gap:9px;">
      <div class="row" style="gap:11px;">
        <div style="width:30px;height:30px;border-radius:10px;background:rgba(253,241,236,.13);display:flex;align-items:center;justify-content:center;flex-shrink:0;">
          <svg viewBox="0 0 24 24" width="16" height="16"><path d="M12 21s6.4-5.6 6.4-10.2a6.4 6.4 0 1 0-12.8 0C5.6 15.4 12 21 12 21Z"/><circle cx="12" cy="10.6" r="2.3"/></svg>
        </div>
        <p class="label" style="color:#FDF1EC;font-size:13.5px;">Amma, Dilini and Ruvini get your live location</p>
      </div>
      <div class="row" style="gap:11px;">
        <div style="width:30px;height:30px;border-radius:10px;background:rgba(253,241,236,.13);display:flex;align-items:center;justify-content:center;flex-shrink:0;">
          <svg viewBox="0 0 24 24" width="16" height="16"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5.5 11.6a6.5 6.5 0 0 0 13 0M12 18.1V21"/></svg>
        </div>
        <p class="label" style="color:#FDF1EC;font-size:13.5px;">Your phone starts recording audio</p>
      </div>
      <div class="row" style="gap:11px;">
        <div style="width:30px;height:30px;border-radius:10px;background:rgba(253,241,236,.13);display:flex;align-items:center;justify-content:center;flex-shrink:0;">
          <svg viewBox="0 0 24 24" width="16" height="16"><path d="M8.1 4.3 5.6 5.4a2.4 2.4 0 0 0-1.4 2.6 15.4 15.4 0 0 0 11.8 11.8 2.4 2.4 0 0 0 2.6-1.4l1.1-2.5-4.1-2.1-1.4 1.6a11.4 11.4 0 0 1-4-4l1.6-1.4Z"/></svg>
        </div>
        <p class="label" style="color:#FDF1EC;font-size:13.5px;">119 is one tap away, already dialled</p>
      </div>
    </div>
  </div>

  <div style="height:22px;flex-shrink:0;"></div>

  <div class="pad" style="flex-shrink:0;">
    <div class="row" style="height:52px;border-radius:16px;border:1px solid rgba(253,241,236,.28);justify-content:center;gap:8px;">
      <svg viewBox="0 0 24 24" width="17" height="17"><path d="m6.6 6.6 10.8 10.8M17.4 6.6 6.6 17.4"/></svg>
      <span style="font-size:15px;font-weight:600;">Release to cancel</span>
    </div>
  </div>
  <div style="height:16px;flex-shrink:0;"></div>
  <div class="gesture-reserve"></div>
</div>
