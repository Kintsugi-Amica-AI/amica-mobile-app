<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Newsreader:opsz,wght@6..72,300;6..72,400;6..72,500;6..72,600&family=DM+Serif+Display&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&family=Playfair+Display:wght@400;500;600;700&family=Karla:wght@400;500;600;700&family=Cormorant+Garamond:wght@400;500;600;700&family=Jost:wght@400;500;600;700&family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,500;12..96,600;12..96,700&family=Public+Sans:wght@400;500;600;700&display=swap">
  <style>
/* ── Amica · "Warm Dawn" design system ───────────────────────────────── */
:root{
  /* Type. Swap these two lines to change the whole design's voice. */
  --serif:'Newsreader',Georgia,'Times New Roman',serif;
  --sans:'Instrument Sans','Helvetica Neue',Arial,sans-serif;
  /* Surfaces */
  --ivory:#FDF8F4;      /* app background */
  --shell:#F6EDE6;      /* recessed / secondary surface */
  --card:#FFFFFF;       /* raised card */
  /* Ink */
  --plum:#3B2230;       /* primary text, deepest brand */
  --plum-70:#6B4F5E;    /* secondary text */
  --plum-45:#7E6473;    /* muted text, icons at rest — 4.95:1 on ivory */
  --line:#EBDFD6;       /* hairline */
  --line-soft:#F2E8E0;  /* card border */
  /* Semantics. terracotta is a FILL; terracotta-deep is the ink-on-ivory
     spelling of it (4.2:1 vs 6.2:1) — use -deep for any text or link. */
  --terracotta:#C2543D; --terracotta-deep:#9E3E2B; --blush:#F7E2DA;
  --sage:#4F7557;       --sage-ink:#3C5B43;        --sage-soft:#E6EEE6;
  --gold:#8F6216;                                   --gold-soft:#F8EEDA;
  --shadow-sm:0 1px 2px rgba(59,34,48,.05), 0 4px 12px rgba(59,34,48,.05);
  --shadow:0 1px 2px rgba(59,34,48,.05), 0 10px 28px rgba(59,34,48,.07);
  --lift:0 2px 4px rgba(59,34,48,.06), 0 18px 40px rgba(59,34,48,.10);
}
/* Night / discreet mode — same structure, matte, no glow */
.night{
  --ivory:#191015; --shell:#241821; --card:#241821;
  --plum:#F4EAE3; --plum-70:#C3ABB6; --plum-45:#9A8290;
  --line:#382933; --line-soft:#31242D;
  --terracotta:#E0705A; --terracotta-deep:#C2543D; --blush:#3B2129;
  --sage:#89B291; --sage-ink:#A7C9AD; --sage-soft:#1F2C22;
  --gold:#D7A75C; --gold-soft:#332619;
  --shadow-sm:none; --shadow:none; --lift:0 18px 40px rgba(0,0,0,.45);
}

*{box-sizing:border-box;}
body{margin:0;background:#EDE4DC;}
a{color:var(--terracotta);text-decoration:none;} a:hover{color:var(--terracotta-deep);}

.screen{
  width:390px;height:844px;overflow:hidden;position:relative;
  background:var(--ivory);color:var(--plum);
  font-family:var(--sans);
  font-size:15px;line-height:1.47;font-weight:400;
  -webkit-font-smoothing:antialiased;text-wrap:pretty;
  display:flex;flex-direction:column;
}
/* Real status bar & home indicator render on top — reserve, never draw. */
.statusbar-reserve{height:54px;flex-shrink:0;}
.gesture-reserve{height:22px;flex-shrink:0;}
.pad{padding-left:20px;padding-right:20px;}
.flow{flex:1 1 auto;display:flex;flex-direction:column;min-height:0;}

/* ── Type ─────────────────────────────────────────────────────────── */
.display{font-family:var(--serif);font-weight:400;
  font-size:31px;line-height:1.14;letter-spacing:-.012em;margin:0;}
.h1{font-family:var(--serif);font-weight:400;font-size:25px;line-height:1.2;margin:0;}
.h2{font-size:18px;font-weight:600;line-height:1.3;letter-spacing:-.01em;margin:0;}
.title{font-size:15.5px;font-weight:600;line-height:1.35;margin:0;}
.body{font-size:14px;line-height:1.5;color:var(--plum-70);margin:0;}
.label{font-size:12.5px;font-weight:500;line-height:1.4;color:var(--plum-70);margin:0;}
.micro{font-size:10px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;
  color:var(--plum-45);margin:0;}
.num{font-variant-numeric:tabular-nums;}

/* ── Primitives ───────────────────────────────────────────────────── */
.card{background:var(--card);border:1px solid var(--line-soft);border-radius:20px;
  padding:16px;box-shadow:var(--shadow-sm);}
.row{display:flex;align-items:center;gap:12px;}
.col{display:flex;flex-direction:column;}
.spacer{flex:1 1 auto;}

.btn{display:flex;align-items:center;justify-content:center;gap:9px;height:54px;
  border-radius:16px;border:0;font-size:15.5px;font-weight:600;letter-spacing:.005em;
  background:var(--plum);color:var(--ivory);}
.btn-quiet{background:var(--shell);color:var(--plum);border:1px solid var(--line);}
.btn-danger{background:var(--terracotta);color:#FFF9F6;}
.btn-safe{background:var(--sage);color:#F4F8F3;}

.pill{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 11px;
  border-radius:999px;font-size:12px;font-weight:600;letter-spacing:.005em;}
.pill-sage{background:var(--sage-soft);color:var(--sage-ink);}
.pill-gold{background:var(--gold-soft);color:var(--gold);}
.pill-blush{background:var(--blush);color:var(--terracotta-deep);}
.pill-quiet{background:var(--shell);color:var(--plum-70);}

.avatar{width:40px;height:40px;border-radius:999px;display:flex;align-items:center;
  justify-content:center;font-size:14px;font-weight:600;flex-shrink:0;}

.dot{width:7px;height:7px;border-radius:999px;flex-shrink:0;}

/* ── Bottom tab bar ───────────────────────────────────────────────── */
.tabbar{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));
  background:var(--card);border-top:1px solid var(--line-soft);padding:9px 8px 4px;flex-shrink:0;}
.tab{display:flex;flex-direction:column;align-items:center;gap:4px;
  color:var(--plum-45);font-size:10.5px;font-weight:600;min-height:46px;justify-content:center;}
.tab-on{color:var(--plum);}

/* ── Hold-to-send SOS ─────────────────────────────────────────────── */
.sos-wrap{display:flex;flex-direction:column;align-items:center;gap:14px;}
.sos{width:186px;height:186px;border-radius:999px;display:flex;align-items:center;
  justify-content:center;position:relative;background:var(--blush);}
.sos-core{width:150px;height:150px;border-radius:999px;background:var(--terracotta);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:7px;
  color:#FFF6F2;box-shadow:var(--lift);}
.sos-ring{position:absolute;inset:0;border-radius:999px;}

/* Icon defaults — every icon is stroke-based inline SVG on a 24 grid */
svg{display:block;fill:none;stroke:currentColor;stroke-width:1.6;
  stroke-linecap:round;stroke-linejoin:round;}
svg.filled{fill:currentColor;stroke:none;}

.tile{display:flex;flex-direction:column;align-items:flex-start;gap:9px;
  background:var(--card);border:1px solid var(--line-soft);border-radius:18px;
  padding:13px 11px;min-height:92px;box-shadow:var(--shadow-sm);}
.tile-ic{width:34px;height:34px;border-radius:11px;display:flex;
  align-items:center;justify-content:center;flex-shrink:0;}
.tile-label{font-size:11.5px;font-weight:600;line-height:1.25;letter-spacing:-.005em;}

.listrow{display:flex;align-items:center;gap:13px;min-height:60px;padding:10px 0;}
.divider{height:1px;background:var(--line-soft);}

/* ── Type options under review ─────────────────────────────────────────
   Each class swaps only the two family variables (plus a little optical
   tuning, so every candidate is judged at its best). Once one is chosen
   its two lines move into :root and these classes go away.            */
.type-a{ --serif:'DM Serif Display',Georgia,serif;
         --sans:'DM Sans','Helvetica Neue',Arial,sans-serif; }
.type-b{ --serif:'Playfair Display',Georgia,serif;
         --sans:'Karla','Helvetica Neue',Arial,sans-serif; }
.type-c{ --serif:'Cormorant Garamond',Georgia,serif;
         --sans:'Jost','Helvetica Neue',Arial,sans-serif; }
.type-d{ --serif:'Bricolage Grotesque','Helvetica Neue',Arial,sans-serif;
         --sans:'Public Sans','Helvetica Neue',Arial,sans-serif; }

.type-a .display{font-size:30px;letter-spacing:-.005em;}
.type-b .display{font-size:29px;}
.type-c .display{font-size:36px;font-weight:600;letter-spacing:0;}
.type-c .h1{font-weight:600;}
.type-d .display{font-size:29px;font-weight:600;letter-spacing:-.022em;}
.type-d .h1{font-weight:600;}
  </style>
</helmet>
<!-- Deliberately unbranded: on screen this must read as the phone's own
     call UI. No Amica wordmark, no Warm Dawn palette, no serif. -->
<div class="screen" style="background:#131316;color:#FFFFFF;font-family:system-ui,'Helvetica Neue',Arial,sans-serif;">
  <div class="statusbar-reserve"></div>

  <div style="height:74px;flex-shrink:0;"></div>

  <div class="col" style="align-items:center;gap:22px;flex-shrink:0;">
    <div style="width:108px;height:108px;border-radius:999px;background:#2E2F34;display:flex;align-items:center;justify-content:center;font-size:40px;font-weight:400;color:#D8D8DC;">A</div>
    <div class="col" style="align-items:center;gap:7px;">
      <div style="font-size:34px;font-weight:400;letter-spacing:-.01em;">Amma</div>
      <div style="font-size:16px;color:#9A9AA2;">mobile</div>
    </div>
  </div>

  <div class="spacer"></div>

  <div style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0;padding:0 56px;flex-shrink:0;">
    <div class="col" style="align-items:center;gap:9px;">
      <div style="width:62px;height:62px;border-radius:999px;background:#2E2F34;display:flex;align-items:center;justify-content:center;color:#FFF;">
        <svg viewBox="0 0 24 24" width="24" height="24"><circle cx="12" cy="12" r="8.4"/><path d="M12 7.2V12l3.2 2"/></svg>
      </div>
      <div style="font-size:13px;color:#C7C7CE;">Remind Me</div>
    </div>
    <div class="col" style="align-items:center;gap:9px;">
      <div style="width:62px;height:62px;border-radius:999px;background:#2E2F34;display:flex;align-items:center;justify-content:center;color:#FFF;">
        <svg viewBox="0 0 24 24" width="24" height="24"><path d="M20.4 12.4a7.6 7.6 0 0 1-8.2 7.6L7 21.4l1.4-4.2a7.6 7.6 0 1 1 12-4.8Z"/></svg>
      </div>
      <div style="font-size:13px;color:#C7C7CE;">Message</div>
    </div>
  </div>

  <div style="height:44px;flex-shrink:0;"></div>

  <div style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0;padding:0 48px;flex-shrink:0;">
    <div class="col" style="align-items:center;gap:11px;">
      <div style="width:76px;height:76px;border-radius:999px;background:#E5484D;display:flex;align-items:center;justify-content:center;color:#FFF;">
        <svg class="filled" viewBox="0 0 24 24" width="31" height="31" style="transform:rotate(134deg);"><path d="M6.6 2.9a1.6 1.6 0 0 1 2 .5l2.1 3a1.6 1.6 0 0 1-.2 2.1L9 9.9a11.6 11.6 0 0 0 5.1 5.1l1.4-1.5a1.6 1.6 0 0 1 2.1-.2l3 2.1a1.6 1.6 0 0 1 .5 2l-1 2.3a2.2 2.2 0 0 1-2.3 1.3A18.4 18.4 0 0 1 2.3 5.6 2.2 2.2 0 0 1 3.6 3.3Z"/></svg>
      </div>
      <div style="font-size:14px;color:#C7C7CE;">Decline</div>
    </div>
    <div class="col" style="align-items:center;gap:11px;">
      <div style="width:76px;height:76px;border-radius:999px;background:#3FA45B;display:flex;align-items:center;justify-content:center;color:#FFF;">
        <svg class="filled" viewBox="0 0 24 24" width="31" height="31"><path d="M6.6 2.9a1.6 1.6 0 0 1 2 .5l2.1 3a1.6 1.6 0 0 1-.2 2.1L9 9.9a11.6 11.6 0 0 0 5.1 5.1l1.4-1.5a1.6 1.6 0 0 1 2.1-.2l3 2.1a1.6 1.6 0 0 1 .5 2l-1 2.3a2.2 2.2 0 0 1-2.3 1.3A18.4 18.4 0 0 1 2.3 5.6 2.2 2.2 0 0 1 3.6 3.3Z"/></svg>
      </div>
      <div style="font-size:14px;color:#C7C7CE;">Accept</div>
    </div>
  </div>

  <div style="height:38px;flex-shrink:0;"></div>
  <div class="gesture-reserve"></div>
</div>
</x-dc>
</body>
