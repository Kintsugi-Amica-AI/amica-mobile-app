name: amica_mobile_app
description: Flutter mobile application for Amica safety features.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  camera: ^0.11.0+2
  cloud_firestore: ^5.6.0
  cloud_functions: ^5.1.3
  firebase_auth: ^5.3.4
  firebase_core: ^3.9.0
  flutter:
    sdk: flutter
  flutter_contacts: ^1.1.9+2
  flutter_localizations:
    sdk: flutter
  geocoding: ^3.0.0
  geolocator: ^13.0.2
  google_maps_flutter: ^2.9.0
  google_mlkit_text_recognition: ^0.16.0
  google_sign_in: ^6.2.2
  image: ^4.2.0
  image_picker: ^1.1.2
  intl: 0.20.2
  shared_preferences: ^2.3.3
  speech_to_text: ^7.4.0
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/images/
    - assets/icons/

  # Bundled, not fetched at runtime: Amica has to render correctly with no
  # network. Both families are SIL Open Font Licence 1.1 — see
  # assets/fonts/OFL.txt.
  fonts:
    - family: BricolageGrotesque
      fonts:
        - asset: assets/fonts/BricolageGrotesque-500.ttf
          weight: 500
        - asset: assets/fonts/BricolageGrotesque-600.ttf
          weight: 600
        - asset: assets/fonts/BricolageGrotesque-700.ttf
          weight: 700
    - family: PublicSans
      fonts:
        - asset: assets/fonts/PublicSans-400.ttf
          weight: 400
        - asset: assets/fonts/PublicSans-500.ttf
          weight: 500
        - asset: assets/fonts/PublicSans-600.ttf
          weight: 600
        - asset: assets/fonts/PublicSans-700.ttf
          weight: 700
