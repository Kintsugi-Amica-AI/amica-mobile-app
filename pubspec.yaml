name: amica_mobile_app
description: Flutter mobile application for Amica safety features.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  camera: ^0.11.0+2
  cloud_firestore: ^5.6.0
  cloud_functions: ^5.1.3
  firebase_auth: ^5.3.4
  firebase_core: ^3.9.0
  flutter:
    sdk: flutter
  flutter_contacts: ^1.1.9+2
  geocoding: ^3.0.0
  geolocator: ^13.0.2
  google_maps_flutter: ^2.9.0
  google_mlkit_text_recognition: ^0.16.0
  google_sign_in: ^6.2.2
  image: ^4.2.0
  image_picker: ^1.1.2
  speech_to_text: ^7.4.0
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
